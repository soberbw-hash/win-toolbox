[package]
name = "win-toolbox"
version = "3.2.0"
description = "给中文用户做的极简 Windows 效率控制台。"
authors = ["soberbw-hash"]
edition = "2021"

[lib]
name = "win_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
encoding_rs = "0.8"
